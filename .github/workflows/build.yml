name: Build Prashi Toon Editor APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Save App Code
        run: cp app/lib/main.dart /tmp/prashi_main.dart

      - name: Create Flutter Project
        run: flutter create app --project-name prashi_toon_editor --platforms=android

      - name: Restore App Code
        run: cp /tmp/prashi_main.dart app/lib/main.dart
      - name: Install Video Packages
        run: flutter pub add image_picker video_player media_kit media_kit_video media_kit_libs_video ffmpeg_kit_flutter_new saver_gallery path_provider share_plus
        working-directory: app
      - name: Build APK
        run: flutter build apk --release
        working-directory: app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Prashi-Toon-Editor-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
